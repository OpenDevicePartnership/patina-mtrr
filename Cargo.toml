[package]
name = "patina_mtrr"
version = "1.1.8"
edition = "2024"
license = "Apache-2.0"
description = "x64 MTRR programming library"
repository = "https://github.com/OpenDevicePartnership/patina-mtrr"
keywords = ["mtrr"]

[dependencies]
bitfield-struct = "0.13"
cfg-if = "1"

[dev-dependencies]
rand = "0.10"

[features]
std = []
doc = []
# All no_std features to test in CI
ci_features = []

[lints.rust]
# Set by cargo-llvm-cov during coverage runs. Declared here so gating
# `coverage_attribute` behind it does not trigger unexpected_cfgs warnings.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }
